<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h3><img src="https://www.svgrepo.com/show/138206/cutting-with-a-scissor-on-broken-line.svg" class="icon-white" height="40px" width="20px" alt="scissors"></h3>
    
    <!-- Twitch / YouTube UI -->
    <div id="retro-ui" style="display: none;">
        <div class="input-group">
            <label for="clip-duration">Capture backwards from now:</label>
            <select id="clip-duration">
                <option value="30">Last 30 Seconds</option>
                <option value="60">Last 60 Seconds</option>
                <option value="120">Last 2 Minutes</option>
                <option value="300">Last 5 Minutes</option>
                <option value="custom">Custom...</option>
            </select>
            <input type="number" id="custom-minutes" placeholder="Minutes (e.g. 10)" style="display: none;">
        </div>
<button id="clip-btn" class="primary-btn">Clip That!</button>
        <button id="cancel-btn" class="danger-btn" style="display: none; margin-top: 10px;">Cancel Download</button>
    </div>

    <!-- TikTok UI -->
    <div id="record-ui" style="display: none;">
        <p class="warning-text">Continuous stream detected. Manual recording required.</p>
        <button id="record-btn" class="danger-btn" data-state="idle">Start Recording</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
