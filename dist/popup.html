<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3><img src="https://www.svgrepo.com/show/138206/cutting-with-a-scissor-on-broken-line.svg" class="icon-white" height="40px" width="20px" alt="scissors"></h3>
    <div class="input-group">
        <div>
            <label>Start Time</label>

    <script src="popup.js"></script>
</body>
</html>
