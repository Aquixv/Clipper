<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: system-ui, sans-serif; width: 300px; padding: 15px; margin: 0; background: #1e1e1e; color: #fff; }
        h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group div { flex: 1; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; text-align: center; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h3>Stream Clipper</h3>
    <div class="input-group">
        <div>
            <label>Start Time</label>
            <input type="text" id="start-time" placeholder="HH:MM:SS">
        </div>
        <div>
            <label>End Time</label>
            <input type="text" id="end-time" placeholder="HH:MM:SS">
        </div>
    </div>
    <button id="clip-btn">Clip Video</button>
    <script src="popup.js"></script>
</body>
</html>
